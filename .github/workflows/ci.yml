name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-simulations:
    name: Rocketry Physics & Telemetry Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic numpy

      - name: Run Pytest simulations
        run: |
          pytest simulations/ -v
